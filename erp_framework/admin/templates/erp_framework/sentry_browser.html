{% if SENTRY_DSN %}
    <script src="https://browser.sentry-cdn.com/11.14.0/bundle.min.js"
            integrity="sha384-jCAqT6eX+TSYGAhAPoGRdVSau37cLPr0E7njTbruV95FY3W1LVq5TAi+/QIwOIy5"
            crossorigin="anonymous"></script>
    <script>
        Sentry.init({
            dsn: "{{ SENTRY_DSN|escapejs }}",
            environment: "{{ SENTRY_ENVIRONMENT|escapejs }}" || undefined,
            release: "{{ SENTRY_RELEASE|escapejs }}" || undefined,
            sendDefaultPii: false,
        });
    </script>
{% endif %}
