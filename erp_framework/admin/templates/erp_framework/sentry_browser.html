{% if error_tracking.dsn %}
    <script src="https://browser.sentry-cdn.com/11.14.0/bundle.min.js"
            integrity="sha384-jCAqT6eX+TSYGAhAPoGRdVSau37cLPr0E7njTbruV95FY3W1LVq5TAi+/QIwOIy5"
            crossorigin="anonymous"></script>
    <script>
        Sentry.init({
            dsn: "{{ error_tracking.dsn|escapejs }}",
            environment: "{{ error_tracking.environment|escapejs }}" || undefined,
            release: "{{ error_tracking.release|escapejs }}" || undefined,
            sendDefaultPii: false,
        });
    </script>
{% endif %}
