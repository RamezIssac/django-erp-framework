version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"

# Build from the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Explicitly set the version of Python and its requirements
python:
  install:
    - requirements: docs/requirements.txt
    # Install the package from this checkout so autodoc documents the
    # branch being built, not the last PyPI release.
    - method: pip
      path: .
