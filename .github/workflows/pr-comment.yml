name: PR comment

on:
  # workflow_run gives fork PRs a pull-requests: write token (Django coverage_comment.yml pattern).
  # The only PR-controlled input is comment.md, posted as text.
  workflow_run:
    workflows: ["API surface"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Replace this report's comment on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('comment.md', 'utf8').slice(0, 65000);
            const marker = body.split('\n', 1)[0];
            if (!/^<!-- [a-z-]+-report -->$/.test(marker)) return core.setFailed('comment.md does not start with a report marker');
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pr = prs.find(p => p.head.sha === run.head_sha);
            if (!pr) return core.info(`No open PR at ${run.head_sha}: a newer push owns the comment.`);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const mine = comments.find(c => c.user.login === 'github-actions[bot]' && (c.body || '').startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
