name: API surface

# Report only: lists the public names of erp_framework a PR adds, removes or changes.
# PR comment (pr-comment.yml) posts comment.md on the PR.
on:
  pull_request:
    branches: [develop]

concurrency:
  group: api-surface-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install griffe==2.4.1

      - name: Diff the public API against the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git rev-parse --short "$(git merge-base "$BASE_SHA" HEAD)")
          python scripts/api_surface.py "$base" "$(git rev-parse --short HEAD)" > comment.md
          tee -a "$GITHUB_STEP_SUMMARY" < comment.md

      - uses: actions/upload-artifact@v4
        with:
          name: pr-comment
          path: comment.md
          retention-days: 1
