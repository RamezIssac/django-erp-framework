name: Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            django-version: '5.2'
          - python-version: '3.12'
            django-version: '6.1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libmemcached-dev  # pylibmc in tests/requirements.txt
          pip install -e . -r tests/requirements.txt "django~=${{ matrix.django-version }}.0"

      - name: Run tests
        run: python tests/runtests.py --noinput
