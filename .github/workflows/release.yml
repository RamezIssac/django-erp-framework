name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # GitHub Release + push back to develop
      id-token: write   # PyPI OIDC trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for the merge-back step

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmemcached-dev  # pylibmc in tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r tests/requirements.txt

      - name: Run tests
        run: python tests/runtests.py --noinput

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          python scripts/extract_changelog.py "$TAG" > release_notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*

      - name: Merge the release tag back into develop
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout develop
          git merge "${GITHUB_REF_NAME}" --no-edit
          git push origin develop
